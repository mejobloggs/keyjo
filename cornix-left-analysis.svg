<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -35 150 105" width="100%" height="100%">
  <defs>
    <style>
      .grid-key { fill: #c8d6e5; stroke: #576574; stroke-width: 0.6; }
      .grid-key-home { fill: #c8d6e5; stroke: #222; stroke-width: 1.5; }
      .extra-key { fill: #7bed9f; stroke: #2ed573; stroke-width: 1; }
      .thumb-key { fill: #feca57; stroke: #e67e22; stroke-width: 1; }
      .label { fill: #2d3436; font-family: monospace; font-size: 3px; text-anchor: middle; font-weight: bold; }
      .label-col { fill: #0984e3; font-family: monospace; font-size: 3px; text-anchor: middle; font-weight: bold; }
      .label-row { fill: #6c5ce7; font-family: monospace; font-size: 2.5px; text-anchor: end; }
      .legend-text { fill: #2d3436; font-family: monospace; font-size: 2.5px; }
      .connector { stroke: #b2bec3; stroke-width: 0.2; stroke-dasharray: 1,1; fill: none; }
      .thumb-arc { stroke: #e67e22; stroke-width: 0.4; stroke-dasharray: 1,1; fill: none; }
      .stagger-label { fill: #636e72; font-family: monospace; font-size: 2px; }
    </style>
  </defs>

  <title>Cornix Left Half — Ergogen Config (24 keys)</title>
  <desc>Cornix left half from ergogen config. 6 columns × 3-4 rows + 3-key thumb fan. 24 keys, 48 total mirrored.</desc>

  <!-- ====== COLUMN HEADERS ====== -->
  <text x="0" y="-24" class="label-col">PINKY</text>
  <text x="19" y="-24" class="label-col">RING</text>
  <text x="38" y="-24" class="label-col">MIDDLE</text>
  <text x="57" y="-24" class="label-col">INDEX</text>
  <text x="76" y="-24" class="label-col">INNER</text>
  <text x="96" y="-24" class="label-col">OUTER</text>

  <!-- ====== ROW LABELS ====== -->
  <text x="-14" y="-4" class="label-row">top</text>
  <text x="-14" y="16" class="label-row">home</text>
  <text x="-14" y="35" class="label-row">bottom</text>
  <text x="-14" y="54" class="label-row">extra</text>

  <!-- ====== GUIDE ARC (home row curve) ====== -->
  <path d="M 0,19 C 19,22 38,24 57,14 76,13 96,9 110,16" class="connector"/>

  <!-- ====== GRID KEYS ====== -->

  <!-- PINKY (col 0, stagger 0): top/y=0, home/y=19, bottom/y=37, extra/y=56 -->
  <rect x="-9" y="-9" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- top -->
  <rect x="-9" y="10" width="18" height="18" rx="1.5" class="grid-key-home"/>   <!-- home -->
  <rect x="-9" y="28" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- bottom -->
  <rect x="-9" y="47" width="18" height="18" rx="1.5" class="extra-key"/>       <!-- extra -->

  <!-- RING (col 1, stagger 3) -->
  <rect x="10" y="-6" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- top -->
  <rect x="10" y="13" width="18" height="18" rx="1.5" class="grid-key-home"/>   <!-- home -->
  <rect x="10" y="31" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- bottom -->
  <rect x="10" y="50" width="18" height="18" rx="1.5" class="extra-key"/>       <!-- extra -->

  <!-- MIDDLE (col 2, stagger 5) -->
  <rect x="29" y="-4" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- top -->
  <rect x="29" y="15" width="18" height="18" rx="1.5" class="grid-key-home"/>   <!-- home -->
  <rect x="29" y="33" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- bottom -->
  <rect x="29" y="52" width="18" height="18" rx="1.5" class="extra-key"/>       <!-- extra -->

  <!-- INDEX (col 3, stagger -5) — 3 rows only -->
  <rect x="48" y="-14" width="18" height="18" rx="1.5" class="grid-key"/>       <!-- top -->
  <rect x="48" y="5" width="18" height="18" rx="1.5" class="grid-key-home"/>    <!-- home -->
  <rect x="48" y="23" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- bottom -->

  <!-- INNER (col 4, stagger -6) — 3 rows only -->
  <rect x="67" y="-15" width="18" height="18" rx="1.5" class="grid-key"/>       <!-- top -->
  <rect x="67" y="4" width="18" height="18" rx="1.5" class="grid-key-home"/>    <!-- home -->
  <rect x="67" y="22" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- bottom -->

  <!-- OUTER (col 5, stagger -3) — 3 rows only -->
  <rect x="87" y="-12" width="18" height="18" rx="1.5" class="grid-key"/>       <!-- top -->
  <rect x="87" y="7" width="18" height="18" rx="1.5" class="grid-key-home"/>    <!-- home -->
  <rect x="87" y="25" width="18" height="18" rx="1.5" class="grid-key"/>        <!-- bottom -->

  <!-- ====== THUMB FAN (3 keys) ====== -->
  <rect x="77" y="39" width="18" height="18" rx="1.5" class="thumb-key"/>       <!-- T1 -->
  <rect x="92" y="47" width="18" height="18" rx="1.5" class="thumb-key"/>       <!-- T2 -->
  <rect x="106" y="55" width="18" height="18" rx="1.5" class="thumb-key"/>      <!-- T3 -->

  <!-- Thumb fan arc connector -->
  <path d="M 86 48 Q 96 53 115 64" class="thumb-arc"/>

  <!-- ====== KEY LABELS ====== -->

  <text x="0" y="-2" class="label" font-size="2.5px">P</text>
  <text x="0" y="17" class="label" font-size="2.5px">P</text>
  <text x="0" y="35" class="label" font-size="2.5px">P</text>
  <text x="0" y="54" class="label" font-size="2.5px">P</text>

  <text x="19" y="1" class="label" font-size="2.5px">R</text>
  <text x="19" y="20" class="label" font-size="2.5px">R</text>
  <text x="19" y="38" class="label" font-size="2.5px">R</text>
  <text x="19" y="57" class="label" font-size="2.5px">R</text>

  <text x="38" y="3" class="label" font-size="2.5px">M</text>
  <text x="38" y="22" class="label" font-size="2.5px">M</text>
  <text x="38" y="40" class="label" font-size="2.5px">M</text>
  <text x="38" y="59" class="label" font-size="2.5px">M</text>

  <text x="57" y="-7" class="label" font-size="2.5px">I</text>
  <text x="57" y="12" class="label" font-size="2.5px">I</text>
  <text x="57" y="30" class="label" font-size="2.5px">I</text>

  <text x="76" y="-8" class="label" font-size="2.5px">In</text>
  <text x="76" y="11" class="label" font-size="2.5px">In</text>
  <text x="76" y="29" class="label" font-size="2.5px">In</text>

  <text x="96" y="-5" class="label" font-size="2.5px">Ot</text>
  <text x="96" y="14" class="label" font-size="2.5px">Ot</text>
  <text x="96" y="32" class="label" font-size="2.5px">Ot</text>

  <!-- Thumb labels -->
  <text x="86" y="48" class="label" font-size="2.5px" fill="#e67e22">T1</text>
  <text x="101" y="56" class="label" font-size="2.5px" fill="#e67e22">T2</text>
  <text x="115" y="64" class="label" font-size="2.5px" fill="#e67e22">T3</text>

  <!-- ====== STAGGER ANNOTATION ====== -->
  <path d="M 0 19 L 96 19" class="connector" stroke="#0984e3"/>
  <text x="48" y="17" class="stagger-label" fill="#0984e3">home row guide</text>

  <!-- ====== LEGEND ====== -->

  <g transform="translate(-10, 70)">
    <text x="0" y="0" class="legend-text" font-size="3px" font-weight="bold">Legend:</text>

    <rect x="0" y="5" width="6" height="4" rx="0.5" class="grid-key"/>
    <text x="10" y="8.5" class="legend-text">Main grid 6×3 = 18 (top/home/bottom)</text>

    <rect x="0" y="13" width="6" height="4" rx="0.5" class="extra-key"/>
    <text x="10" y="16.5" class="legend-text">Extra row 3 (pinky/ring/middle)</text>

    <rect x="0" y="21" width="6" height="4" rx="0.5" class="thumb-key"/>
    <text x="10" y="24.5" class="legend-text">Thumb fan 3</text>

    <text x="0" y="32" class="legend-text" font-size="2.5px" fill="#636e72">Left half: 24 keys → Unibody: 48 keys</text>
  </g>

</svg>
